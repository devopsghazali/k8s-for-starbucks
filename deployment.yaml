apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbucks-react
  namespace: dev
spec:
  replicas: 2

  selector:
    matchLabels:
      app: starbucks-react

  template:
    metadata:
      labels:
        app: starbucks-react
    spec:
      containers:
        - name: starbucks-react
          image: devops/starbucks-react:9
          ports:
            - containerPort: 3000
